<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador numeros aleatorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/estilos.css">
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        <div id="encabezado" class="text-center mb-4">
            <h1>Generador de Números Pseudoaleatorios</h1>
            <p class="text-light">Método Congruencial Multiplicativo</p>
        </div>
        <div id="formulario" class="card bg-dark text-white   p-4 ">
            <form action="calculador.html" method="get" onsubmit="return validador()">
                <div class="mb-3">
                    <label for="semilla" class="form-label">Semilla (X₀):</label>
                    <input type="number" class="form-control" name="semilla" id="semilla" required min="1" placeholder="Ej: 7 (impar)">
                </div>
                <div class="mb-3">
                    <label for="multiplicador" class="form-label">Multiplicador (a):</label>
                    <input type="number" class="form-control" name="multiplicador" id="multiplicador" required min="1" placeholder="Ej: 19 (3 + 8*2)">
                </div>
                <div class="mb-3">
                    <label for="modulo" class="form-label">Módulo (m):</label>
                    <input type="number" class="form-control" name="modulo" id="modulo" required min="2" placeholder="Ej: 64 (2^6)">
                </div>
                <div class="mb-3">
                    <label for="cantidad" class="form-label">Cantidad a generar (n):</label>
                    <input type="number" class="form-control" name="cantidad" id="cantidad" required min="1" placeholder="Ej: 20">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1">Generar Tabla</button>
                    <button type="reset" class="btn btn-danger">Reiniciar</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="JS/validarnumeros.js"></script>

    <footer> 
        Bordon Guanco Joel MU:2010- | Franco Sedan Caniza MU:1930
    </footer>
</body>
</html>
