<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="710" viewBox="0 0 1250 710" role="img" aria-label="Diagrama de Forrester, dos stocks y cinco flujos de arribos, atenciones, abandonos, ampliación y obsolescencia">
<defs><marker id="az" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#0369a1"/></marker><marker id="gris" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker><style>text{font-family:Arial,sans-serif;fill:#163453}.titulo{font-size:27px;font-weight:800}.mini{font-size:16px;fill:#57728c}.stock{fill:#dceefe;stroke:#1d5f9b;stroke-width:3}.tstock{font-size:22px;font-weight:800}.tflow{font-size:18px;font-weight:750}.pipe{fill:none;stroke:#0369a1;stroke-width:5;marker-end:url(#az)}.conn{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#gris)}.valve{fill:#f8fafc;stroke:#0369a1;stroke-width:3}.cloud{fill:none;stroke:#64748b;stroke-width:3}</style></defs>
<rect width="1250" height="710" fill="#ffffff" rx="20"/>
